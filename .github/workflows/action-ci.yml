name: Ruby CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }} / ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ['2.7', '3.3', '3.4', '4.0', 'truffleruby', 'jruby']
        exclude:
          # macOS & Windows are only tested with the latest MRI (4.0)
          - os: macos-latest
            ruby: '2.7'
          - os: macos-latest
            ruby: '3.3'
          - os: macos-latest
            ruby: '3.4'
          - os: macos-latest
            ruby: 'truffleruby'
          - os: macos-latest
            ruby: 'jruby'
          - os: windows-latest
            ruby: '2.7'
          - os: windows-latest
            ruby: '3.3'
          - os: windows-latest
            ruby: '3.4'
          - os: windows-latest
            ruby: 'truffleruby'
          - os: windows-latest
            ruby: 'jruby'

    runs-on: ${{ matrix.os }}

    # mark certain combos as optional so failures won't block merges:
    continue-on-error: ${{ or(eq(matrix.ruby, '2.7'), eq(matrix.ruby, 'truffleruby'), startsWith(matrix.os, 'macos-'), startsWith(matrix.os, 'windows-')) }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java for JRuby
        if: ${{ matrix.ruby == 'jruby' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Print versions
        run: |
          ruby -v
          gem -v
          bundle -v

      - name: Run linters and test suite
        run: bundle exec rake ci
